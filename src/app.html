<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var MARK =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56.1 -115.1 672.2 672.2"><g fill="%c" transform="translate(0,442) scale(0.1,-0.1)"><path d="M2 4378 l3 -43 87 -17 c111 -22 179 -56 245 -126 61 -63 75 -91 259 -497 70 -154 175 -386 234 -515 59 -129 153 -336 209 -460 168 -370 236 -518 404 -880 88 -190 167 -363 177 -385 10 -22 66 -143 125 -270 59 -126 148 -315 196 -420 49 -104 95 -195 102 -203 8 -7 20 -10 28 -7 8 3 56 83 108 178 52 94 131 237 176 317 45 80 103 186 130 235 l47 91 -172 359 c-212 441 -336 704 -405 855 -29 63 -98 214 -155 335 -56 121 -129 277 -161 348 -128 276 -179 388 -244 527 -112 242 -128 288 -121 344 12 102 94 159 254 175 114 12 132 21 132 66 l0 35 -831 0 -830 0 3 -42z"/><path d="M3150 4385 c0 -43 10 -48 134 -70 103 -19 151 -40 212 -97 59 -54 84 -123 84 -231 0 -150 -67 -356 -230 -712 -104 -227 -146 -333 -135 -343 4 -4 20 9 36 28 28 35 181 275 312 490 379 622 443 720 509 775 50 42 144 83 207 90 88 10 101 18 101 65 l0 40 -615 0 -615 0 0 -35z"/><path d="M3417 3048 c-8 -13 -115 -180 -237 -373 -123 -192 -295 -465 -383 -605 -88 -140 -182 -288 -209 -328 -41 -60 -47 -75 -38 -92 6 -11 16 -20 23 -20 7 0 52 54 100 120 49 66 92 120 98 120 13 0 12 -1344 -1 -1435 -30 -207 -110 -280 -340 -309 l-95 -12 -3 -57 -3 -57 1581 0 c1455 0 1580 1 1580 16 0 14 85 709 105 860 6 39 4 42 -23 47 -53 11 -68 0 -92 -66 -52 -144 -133 -268 -248 -379 -184 -178 -402 -275 -695 -309 -95 -11 -765 -13 -827 -3 -62 10 -134 37 -166 61 -18 13 -42 47 -55 76 l-24 52 -3 1358 c-2 1182 -4 1357 -17 1357 -8 0 -21 -10 -28 -22z"/></g></svg>';
        var root = document.documentElement;
        var icon = document.querySelector('link[rel="icon"]');
        var browserDark = window.matchMedia('(prefers-color-scheme: dark)');

        // The favicon sits in browser chrome, so it tracks the BROWSER theme --
        // deliberately independent of the site theme, which the toggle owns below.
        // Repainting the href (rather than relying on prefers-color-scheme inside
        // the SVG) is what makes this work in Safari, which ignores CSS embedded
        // in SVG favicons.
        function paintIcon() {
          var color = browserDark.matches ? '#ffffff' : '#001d56';
          icon.href = 'data:image/svg+xml,' + encodeURIComponent(MARK.replace('%c', color));
        }

        paintIcon();
        browserDark.addEventListener('change', paintIcon);

        // Site theme: stored choice wins, otherwise fall back to the browser's.
        try {
          var stored = localStorage.getItem('theme');
          root.classList.toggle(
            'dark',
            stored === 'dark' || (stored !== 'light' && browserDark.matches)
          );
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-on-surface antialiased overflow-x-hidden">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
